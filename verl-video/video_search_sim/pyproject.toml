[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-search-sim"
version = "0.1.0"
description = "Local video_search / watch_video simulation environment for Video Deep Research Agent RL training (verl)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "video-search-sim" }]
license = { text = "Apache-2.0" }
keywords = ["rl", "agent", "video", "retrieval", "verl", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    # core
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    # retrieval
    "bm25s>=0.2.1",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    # embedding / vision (openai/clip-vit-large-patch14-336)
    "torch>=2.7",
    "transformers>=4.44",
    "Pillow>=10.0",
    "decord>=0.6.0",
    # data source
    "huggingface-hub>=0.24",
    "datasets>=2.20",
    # service
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.scripts]
vss-build-corpus = "video_search_sim.video_corpus.cli:main"
vss-serve = "video_search_sim.retrieval_service.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_search_sim*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length (handled by formatter)
    "B008", # function calls in defaults (FastAPI uses Depends())
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
