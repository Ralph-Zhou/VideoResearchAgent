[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-research-agent"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "VideoResearchAgent: open-web video research and sim-to-real training"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openai>=1.40,<3", "httpx>=0.27,<1", "pydantic>=2.10,<3",
  "python-dotenv>=1", "pyyaml>=6", "numpy>=1.26,<3", "Pillow>=10",
  "opencv-python-headless>=4.8", "yt-dlp[default]==2026.3.13",
  "ffmpeg-python>=0.2",
  "torch>=2.7", "torchvision>=0.22", "accelerate>=1",
  "transformers>=4.56,<5", "tqdm>=4.65"
]

[project.optional-dependencies]
local-server = ["vllm==0.17.1"]
synthesis = ["pandas>=2", "pyarrow>=19", "decord>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1", "pyarrow>=19"]

[tool.setuptools.packages.find]
where = ["."]
include = ["video_agent*", "eval*"]

[tool.setuptools.package-data]
video_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
